<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in | AutoAttend</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a><main id="main-content" tabindex="-1" class="container" style="max-width:440px;margin:10vh auto">
<section aria-labelledby="auth-heading" style="background:#1e293b;padding:32px;border-radius:14px;color:white">
<h1>🎓 AutoAttend</h1><h2 id="auth-heading">Sign in</h2>
{% if error %}<p role="alert" style="color:#fda4af">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('login') }}">
<label for="username">Username</label><input id="username" name="username" required autocomplete="username" maxlength="50" style="display:block;width:100%;padding:12px;margin:8px 0 18px">
<label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password" style="display:block;width:100%;padding:12px;margin:8px 0 18px">
<button type="submit" style="padding:12px 24px;cursor:pointer">Sign in</button>
</form></section></main></body></html>
