<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Initial setup | AutoAttend</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a><main id="main-content" tabindex="-1" class="container" style="max-width:480px;margin:8vh auto">
<section aria-labelledby="auth-heading" style="background:#1e293b;padding:32px;border-radius:14px;color:white">
<h1>🎓 AutoAttend</h1><h2 id="auth-heading">Create your administrator account</h2>
<p>First-time setup only. Choose your own username and password. The setup token protects this page from unauthorized visitors.</p>
{% if error %}<p role="alert" style="color:#fda4af">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('first_run_setup') }}">
<label for="username">Admin username</label><input id="username" name="username" required minlength="3" maxlength="50" autocomplete="username" style="display:block;width:100%;padding:12px;margin:8px 0 18px">
<label for="password">Password (12+ characters)</label><input id="password" name="password" type="password" required minlength="12" autocomplete="new-password" style="display:block;width:100%;padding:12px;margin:8px 0 18px">
<label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" required minlength="12" autocomplete="new-password" style="display:block;width:100%;padding:12px;margin:8px 0 18px">
<label for="setup_token">One-time setup token</label><input id="setup_token" name="setup_token" type="password" required autocomplete="off" style="display:block;width:100%;padding:12px;margin:8px 0 18px">
<button type="submit" style="padding:12px 24px;cursor:pointer">Create administrator</button>
</form></section></main></body></html>
